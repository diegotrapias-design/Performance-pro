name: Extract Performance Pro

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Get repository
        uses: actions/checkout@v4

      - name: Extract project files
        run: |
          set -e
          ZIP="performance-pro-deploy-corrigido.zip"
          test -f "$ZIP" || { echo "ZIP não encontrado: $ZIP"; exit 1; }
          mkdir -p /tmp/performance-pro
          unzip -q "$ZIP" -d /tmp/performance-pro
          SRC="/tmp/performance-pro"
          if [ ! -f "$SRC/package.json" ]; then
            DIRS=$(find "$SRC" -mindepth 1 -maxdepth 1 -type d)
            if [ "$(printf '%s\n' "$DIRS" | grep -c .)" -eq 1 ]; then
              SRC="$DIRS"
            fi
          fi
          test -f "$SRC/package.json" || { echo "package.json não encontrado"; exit 1; }
          rsync -a --exclude='.git' "$SRC/" ./

      - name: Save extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Add Performance Pro application files"
            git push
          else
            echo "Nenhuma alteração para salvar."
          fi
